[workspace]
members = [
    "src/dfinance_backend", 
    "src/dtoken", 
    "src/debttoken", 
    "src/token_ledger",
    "src/logs",
]
resolver = "2"

[workspace.package]
version = "0.9.3"
edition = "2021"
categories = ["blockchain"]
keywords = ["file", "storage", "oss", "s3", "icp"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1.6.0"
candid = "0.10.6"
candid_parser = "0.1.2"
candid-extractor = "0.1.4"
hex = { version = "0.4.3", features = ["serde"] }
ic-cdk = "0.15.0"
ic-cdk-macros = "0.15.0"
ic-cdk-timers = "0.7.0"
ic-metrics-encoder = "1.1.1"
ic-stable-structures = "0.6.5"
ic-xrc-types = "1.0.0"
num-traits = { version = "0.2.14", features = ["libm"] }
regex = "1.10.4"
serde = { version = "1.0.203", features = ["derive"] }
serde_bytes = "0.11.15"
serde_json = "1.0"
time = "0.3.36"
once_cell = "1.19.0"
uint = "0.8"
dotenv = "0.15.0"
env_logger = "0.11"
futures = "0.3"
canbench-rs = { version = "0.1.4" }
ciborium = { git = "https://github.com/enarx/ciborium", rev = "e719537c99b564c3674a56defe53713c702c6f46" }
icrc-ledger-types = { git = "https://github.com/dfinity/ic.git" }
